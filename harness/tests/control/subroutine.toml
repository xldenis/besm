# /-N calls operator N as a sub-routine and \- returns.

xfail = "pp-besm: /N consumes the '/' of /-N so calls never parse, and \\- (JCC) is not lowered"

program = '''
1. Variable Addresses

2. Parameters

3. List of Constants and Variable Quantities

0, 1, 10, x

4. Logical Scheme

0 => x; /-0110; x + 1 => x; /-0110; stop; L0110 x + 10 => x; \-
'''

[expect.values]
x = 21
