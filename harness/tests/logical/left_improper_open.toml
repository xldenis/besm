# P with (-∞, 5): 4 is inside, 5 and 6 are not.

xfail = "pp-besm crashes in BitLayout.hs:63 encoding logical operators"

program = '''
1. Variable Addresses

(w) Block w (1 cells)

<w_0> = 0

2. Parameters

3. List of Constants and Variable Quantities

0, 1, 4, 5, 6, x, p, q, r

4. Logical Scheme

4 => x; P(x, 0112; 0111 / (-∞, 5)); L0111 1 => p; /0113; L0112 0 => p; L0113
5 => x; P(x, 0122; 0121 / (-∞, 5)); L0121 1 => q; /0123; L0122 0 => q; L0123
6 => x; P(x, 0132; 0131 / (-∞, 5)); L0131 1 => r; /0133; L0132 0 => r; L0133
stop
'''

[expect.values]
p = 1
q = 0
r = 0
