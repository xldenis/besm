# Dot product of two blocks.

xfail = "compiled programme runs into an empty word in block K"

program = '''
1. Variable Addresses

(a) Block a (3 cells)

<a_i> = 1.i
<a_0> = 0
<a_1> = 1
<a_2> = 2

(b) Block b (3 cells)

<b_i> = 1.i
<b_0> = 0
<b_1> = 1
<b_2> = 2

2. Parameters

i : i_in = 0, i_fin = 3

3. List of Constants and Variable Quantities

0, 1, 2, 3, 4, 5, 6, s

4. Logical Scheme

1 => a_0; 2 => a_1; 3 => a_2; 4 => b_0; 5 => b_1; 6 => b_2; 0 => s; [i s + a_i * b_i => s]; stop
'''

[expect.values]
s = 32
