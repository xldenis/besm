4. Logical Scheme

0 => a_0; 0 => a_1; 0 => a_2; 0 => a_3; 0 => a_4; [i i + 1 => a_i]; a_0 => p; a_1 => q; a_2 => r; a_3 => s; a_4 => t; stop
