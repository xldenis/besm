# <a_ll> = 4.l is the diagonal of a 3 x 3 block (as a_ll = 11.l in chapter1.pp).

xfail = "loop markers (open-parenthesis words) left in block K; executing one traps"

program = '''
1. Variable Addresses

(a) Block a (9 cells)

<a_k> = 1.k
<a_ll> = 4.l
<a_0> = 0
<a_1> = 1
<a_4> = 4
<a_8> = 8

2. Parameters

k : k_in = 0, k_fin = 9
l : l_in = 0, l_fin = 3

3. List of Constants and Variable Quantities

0, 1, 3, 9, p, q, r, s

4. Logical Scheme

[k 0 => a_k]; [l 1 => a_ll]; a_0 => p; a_1 => q; a_4 => r; a_8 => s; stop
'''

[expect.values]
p = 1
q = 0
r = 1
s = 1
