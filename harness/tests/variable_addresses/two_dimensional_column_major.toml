# <a_ij> = 1.i + 2.j: the slopes go with the right parameters.

xfail = "loop markers (open-parenthesis words) left in block K; executing one traps"

program = '''
1. Variable Addresses

(a) Block a (6 cells)

<a_ij> = 1.i + 2.j
<a_0> = 0
<a_1> = 1
<a_2> = 2
<a_3> = 3
<a_4> = 4
<a_5> = 5

2. Parameters

j : j_in = 0, j_fin = 3
i : i_in = 0, i_fin = 2

3. List of Constants and Variable Quantities

0, 1, 2, 3, c, p, q, r, s, t, u

4. Logical Scheme

0 => c; [i [j c => a_ij; c + 1 => c]]; a_0 => p; a_1 => q; a_2 => r; a_3 => s; a_4 => t; a_5 => u; stop
'''

[expect.values]
p = 0
q = 3
r = 1
s = 4
t = 2
u = 5
