# <b_i> = -1.i + 3 walks the block backwards (reversing a into b).

xfail = "loop markers (open-parenthesis words) left in block K; executing one traps"

program = '''
1. Variable Addresses

(a) Block a (4 cells)

<a_i> = 1.i
<a_0> = 0
<a_1> = 1
<a_2> = 2
<a_3> = 3

(b) Block b (4 cells)

<b_i> = -1.i + 3
<b_0> = 0
<b_1> = 1
<b_2> = 2
<b_3> = 3

2. Parameters

i : i_in = 0, i_fin = 4

3. List of Constants and Variable Quantities

1, 2, 3, 4, 0, p, q, r, s

4. Logical Scheme

1 => a_0; 2 => a_1; 3 => a_2; 4 => a_3; [i a_i => b_i]; b_0 => p; b_1 => q; b_2 => r; b_3 => s; stop
'''

[expect.values]
p = 4
q = 3
r = 2
s = 1
