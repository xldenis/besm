# Division giving fractions (negative exponents).

xfail = "* and : compile to DS sub-routine calls (Sub 0101 x 0001; CLCC 04E0) instead of × / : instructions; the DS cell is empty"

program = '''
1. Variable Addresses

2. Parameters

3. List of Constants and Variable Quantities

1, 4, 3, 2, x, y

4. Logical Scheme

1 : 4 => x; 3 : 2 => y; stop
'''

[expect]
tolerance = 1e-6

[expect.values]
x = 0.25
y = 1.5
