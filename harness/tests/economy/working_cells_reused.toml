# Consecutive formulas reuse working cells without clobbering results.

program = '''
1. Variable Addresses

(w) Block w (1 cells)

<w_0> = 0

2. Parameters

3. List of Constants and Variable Quantities

1, 2, 3, 4, 5, 6, x, y, z

4. Logical Scheme

1 + 2 * 3 => x; 4 + 5 * 6 => y; x + y => z; stop
'''

[expect.values]
x = 7
y = 34
z = 41
